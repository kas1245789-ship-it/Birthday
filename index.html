<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#27113f">
<title>A tiny birthday mission for Minsa ✨</title>
<style>
:root{--ink:#fff8ff;--muted:#e8d8ef;--pink:#ff91c8;--gold:#ffe6a3;--violet:#a984ff;--glass:rgba(255,255,255,.105)}*{box-sizing:border-box}html{min-height:100%;background:#211034}body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.55 ui-rounded,"Segoe UI",system-ui,sans-serif;background:radial-gradient(ellipse at 50% 0%,#70417f 0%,#38204f 40%,#20112f 100%);overflow-x:hidden}button{font:inherit;color:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.sky:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:#ffe6b5;opacity:.17;filter:blur(2px);right:10%;top:8%;box-shadow:0 0 90px 35px #ffd79a}.star{position:absolute;color:#fff3bd;animation:twinkle 3s infinite alternate}.float{position:absolute;opacity:.3;animation:drift 13s ease-in-out infinite}.app{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:34px 18px}.top{position:fixed;top:17px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;z-index:5}.brand{font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:#eadcf6}.music{border:1px solid #ffffff45;background:#ffffff14;border-radius:999px;padding:10px 15px;backdrop-filter:blur(12px)}main{width:min(760px,100%)}.card{border:1px solid #ffffff30;border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.07));box-shadow:0 24px 90px #10061b80,inset 0 1px #ffffff36;backdrop-filter:blur(18px);padding:clamp(25px,6vw,56px);text-align:center;animation:arrive .6s cubic-bezier(.2,.8,.2,1)}h1,h2{line-height:1.13;margin:.35em 0 .5em;letter-spacing:-.035em}h1{font-size:clamp(2.6rem,9vw,5.2rem)}h2{font-size:clamp(1.8rem,5vw,3rem)}p{color:var(--muted);font-size:1.08rem}.eyebrow{font-size:.8rem;text-transform:uppercase;letter-spacing:.18em;color:#ffe5b0}.hero{font-size:5rem;display:block;filter:drop-shadow(0 8px 25px #ffc1df66);animation:bob 3s ease-in-out infinite}.btn{border-radius:999px;padding:14px 23px;margin:7px;background:linear-gradient(120deg,#ff88c0,#a77aff);box-shadow:0 10px 26px #ca66dc40;color:white;font-weight:750;transition:transform .2s,filter .2s}.btn:hover{transform:translateY(-3px) scale(1.03);filter:brightness(1.1)}.btn.alt{background:#ffffff16;border:1px solid #ffffff36;box-shadow:none}.btn.gold{background:linear-gradient(120deg,#ffca77,#ff83b8);color:#4d2547}.progress{display:flex;align-items:center;gap:12px;margin-bottom:26px;color:#f4e9fc;font-size:.9rem}.track{height:7px;background:#ffffff20;border-radius:9px;flex:1;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ff8bc5,#ffe8a2);border-radius:9px;transition:width .5s}.choices{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:24px 0}.face{font-size:4rem;margin:5px}.reaction{min-height:1.8em;color:#ffe9ad;font-weight:700}.heart{position:fixed;z-index:4;font-size:2rem;cursor:pointer;filter:drop-shadow(0 0 10px #ff70b8);animation:heartfloat 3s linear forwards}.candle{font-size:3rem;display:inline-block;cursor:pointer;transition:.2s}.candle.off{filter:grayscale(1);opacity:.4;transform:scale(.8)}.cake{font-size:5rem}.arena{height:170px;position:relative;border-radius:22px;background:#ffffff0c;margin:16px 0}.runner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:3rem;cursor:pointer}.fake{position:relative}.giftstage{display:flex;align-items:end;justify-content:center;gap:18px;margin:24px auto 0;position:relative;min-height:210px}.bear{font-size:5rem;animation:bob 2.2s infinite}.gift{position:relative;font-size:7rem;filter:drop-shadow(0 0 23px #ffd473);animation:bob 2.7s infinite}.duck{font-size:5rem;position:absolute;left:50%;bottom:32px;opacity:0;transform:translate(-50%,60px) scale(.3);transition:all 1s cubic-bezier(.2,1.5,.5,1)}.reveal .duck{opacity:1;transform:translate(-50%,-90px) scale(1.15);animation:duck 1s ease-in-out infinite alternate}.reveal .gift{animation:pop .7s}.reveal .bear{animation:bob .5s infinite}.hidden{display:none!important}.small{font-size:.9rem}.confetti{position:fixed;z-index:4;pointer-events:none;animation:fall 2.7s linear forwards}.noscript{max-width:700px;margin:15vh auto;padding:36px;text-align:center;border-radius:28px;background:#ffffff18}@keyframes twinkle{to{opacity:.25;transform:scale(.65)}}@keyframes drift{50%{transform:translate(25px,-35px) rotate(12deg)}}@keyframes bob{50%{transform:translateY(-9px) rotate(2deg)}}@keyframes arrive{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}@keyframes heartfloat{to{transform:translateY(-150px) rotate(35deg);opacity:0}}@keyframes fall{to{transform:translateY(110vh) rotate(700deg);opacity:.1}}@keyframes duck{to{transform:translate(-50%,-98px) rotate(8deg) scale(1.15)}}@keyframes pop{50%{transform:scale(1.18) rotate(-4deg)}}@media(max-width:560px){.top{left:12px;right:12px}.brand{font-size:.68rem}.card{border-radius:23px}.btn{min-height:48px}.giftstage{min-height:170px}.gift{font-size:5.5rem}.bear{font-size:4rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style></head>
<body><div class="sky" id="sky" aria-hidden="true"></div><div class="top"><span class="brand">✦ Minsa’s birthday mission</span><button class="music" id="music" aria-label="Play Happy Birthday music" aria-pressed="false">♫ Music: off</button></div><div class="app"><main id="main" aria-live="polite"></main></div>
<noscript><div class="noscript"><div class="hero">🎂✨</div><h1>Happy Birthday, Minsa! 🎉💕</h1><h2>4 October</h2><p>I wish may you live long with happiness.</p><p>Now go enjoy your cake! 🎂🦆</p></div></noscript>
<script>
(()=>{const main=document.querySelector('#main'),sky=document.querySelector('#sky');let step=0,quiz=0,stars=0,candles=3,musicOn=false,ctx,timer;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
for(let i=0;i<48;i++){let s=document.createElement('span');s.className='star';s.textContent=i%5?'✦':'·';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;font-size:${8+Math.random()*18}px;animation-delay:${Math.random()*3}s`;sky.append(s)}
function burst(n=24){if(reduced)return;for(let i=0;i<n;i++){let e=document.createElement('span');e.className='confetti';e.textContent=['✨','💕','⭐','🎉'][Math.random()*4|0];e.style.cssText=`left:${Math.random()*100}vw;top:-30px;font-size:${12+Math.random()*20}px;animation-delay:${Math.random()*.8}s`;document.body.append(e);setTimeout(()=>e.remove(),3600)}}
const card=(inside)=>`<section class="card">${inside}</section>`;function home(){main.innerHTML=card(`<span class="eyebrow">A very important tiny mission</span><span class="hero" aria-hidden="true">🌙💫</span><h1>Hey Minsa! 👀💕</h1><p>I have a tiny birthday mission for you…</p><p class="small">Nine extremely serious challenges. One extremely unserious surprise.</p><button class="btn" onclick="start()">Start the Mission 🚀</button><p class="small">Sound is optional. Smiling is highly encouraged.</p>`)}window.start=()=>{step=1;startMusic();render()};
const tasks=[['The Serious Smile Test 😐😂','Can you smile for exactly 3 seconds?','😐'],['Catch the Naughty Heart 💗','That heart is making a run for it. Catch it!','💗'],['Don’t Touch the Wrong Button 😈','One of these buttons is absolutely not tempting.','🙈'],['Birthday Cake Emergency 🎂🚨','Quick! Save the cake before the candles escape!','🎂'],['Pick Your Birthday Mood 🎀','Choose your birthday energy. Choose wisely-ish.','🎀'],['The Suspicious Button 👀','Seriously. Something ridiculous may happen.','👀'],['Make the Birthday Magic ✨','Tap the stars and make this birthday magical.','🌟'],['The Tiny Birthday Quiz 🧠😂','Three questions. One birthday genius.','🧠'],['One More… Promise? 👀','Okay… only ONE more thing.','🤫']];
function progress(){return `<div class="progress"><span>Task ${step}/10</span><span class="track"><span class="fill" style="display:block;width:${step*10}%"></span></span></div>`}function nextButton(){return `<button class="btn" onclick="advance()">Continue ✨</button>`}function done(msg){document.querySelector('#reaction').textContent=msg;burst(19);let b=document.querySelector('#continue');if(b)b.classList.remove('hidden')}
function render(){if(step===10){final();return}let [title,desc,icon]=tasks[step-1],content='';if(step===1)content=`<div class="face">${icon}</div><p>${desc}</p><button class="btn gold" onclick="smile()">SMILE 😁</button><div id="reaction" class="reaction"></div><button id="continue" class="btn hidden" onclick="advance()">Continue ✨</button>`;
if(step===2)content=`<p>${desc}</p><div class="arena" id="arena"><span class="runner" id="runner" role="button" tabindex="0" aria-label="Catch the naughty heart" onclick="caught()" onpointerenter="escapeHeart()">💗</span></div><div id="reaction" class="reaction">Catch it with a tap!</div><button id="continue" class="btn hidden" onclick="advance()">Continue ✨</button>`;
if(step===3)content=`<p>${desc}</p><div class="choices">${['DO NOT CLICK','Seriously, DON\'T','Definitely Not This One'].map((x,i)=>`<button class="btn alt" onclick="fakeClick(this,${i})">${x}</button>`).join('')}</div><div id="reaction" class="reaction">${' '}</div><button id="continue" class="btn hidden" onclick="advance()">Continue ✨</button>`;
if(step===4)content=`<p>${desc}</p><div class="cake">🎂</div><div>${Array.from({length:candles},(_,i)=>`<button class="candle" aria-label="Blow out candle" onclick="blow(this)">🕯️</button>`).join('')}</div><div id="reaction" class="reaction">Tap every candle!</div><button id="continue" class="btn hidden" onclick="advance()">Continue ✨</button>`;
if(step===5)content=`<p>${desc}</p><div class="choices">${['Cute 🌸','Crazy 😂','Absolutely Unstoppable 😎'].map((x,i)=>`<button class="btn alt" onclick="mood(${i})">${x}</button>`).join('')}</div><div id="reaction" class="reaction"></div><button id="continue" class="btn hidden" onclick="advance()">Continue ✨</button>`;
if(step===6)content=`<p>${desc}<br><span class="small">Nothing weird will happen. Probably.</span></p><button class="btn gold" onclick="suspicious()">DO NOT PRESS THIS BUTTON</button><div id="reaction" class="reaction"></div><button id="continue" class="btn hidden" onclick="advance()">Continue ✨</button>`;
if(step===7)content=`<p>${desc}</p><div class="choices" id="starset">${['✦','✧','⋆','✦','✧','⋆','✦'].map((x,i)=>`<button class="btn alt" aria-label="Collect star ${i+1}" onclick="collect(this)">${x}</button>`).join('')}</div><div id="reaction" class="reaction">Magic level: 0%</div><button id="continue" class="btn hidden" onclick="advance()">Continue ✨</button>`;
if(step===8)content=`<p id="question"></p><div class="choices" id="answers"></div><div id="reaction" class="reaction"></div><button id="continue" class="btn hidden" onclick="advance()">Continue ✨</button>`;
if(step===9)content=`<p>Okay… only ONE more thing.</p><button class="btn gold" onclick="lie()">I'M READY ✨</button><div id="reaction" class="reaction"></div><button id="continue" class="btn hidden" onclick="advance()">Continue ✨</button>`;
main.innerHTML=card(`${progress()}<span class="eyebrow">A mission for Minsa</span><h2>${title}</h2>${content}`);if(step===8)quizRender()}
window.advance=()=>{step++;if(step===10)burst(65);render()};window.smile=()=>{let b=document.querySelector('#reaction');b.textContent='Hold that smile for 3 seconds…';setTimeout(()=>{if(step===1)done('Okay… that was suspiciously cute 😂💕')},3000)};window.escapeHeart=()=>{let r=document.querySelector('#runner');if(!r)return;r.style.left=Math.random()*80+10+'%';r.style.top=Math.random()*70+15+'%'};window.caught=()=>done('Got it! That heart was definitely looking for you 😂❤️');window.fakeClick=(el)=>{el.animate([{transform:'translateX(0)'},{transform:'translateX(16px) rotate(4deg)'},{transform:'translateX(-8px)'},{transform:'none'}],{duration:420});let r=document.querySelector('#reaction');r.textContent='You knew you were going to click it 😂';document.querySelector('#continue').classList.remove('hidden')};window.blow=(el)=>{el.classList.add('off');burst(5);candles--;if(!candles)done('Cake saved! You are officially a birthday hero 🫡🎂')};window.mood=(i)=>{let reactions=['A flower-powered icon! 🌸','Chaos, but make it birthday 😂','Please leave some fabulous for the rest of us 😎'];document.querySelector('#reaction').textContent=reactions[i]+' Correct. Today you are allowed to be all three. 😂💕';document.querySelector('#continue').classList.remove('hidden');burst(20)};window.suspicious=()=>{burst(44);document.querySelector('#reaction').textContent='I KNEW YOU WOULD PRESS IT 😂';document.querySelector('#continue').classList.remove('hidden')};window.collect=(b)=>{if(b.disabled)return;b.disabled=true;b.textContent='💖';stars++;document.querySelector('#reaction').textContent=`Magic level: ${Math.round(stars/7*100)}% ✨💕`;burst(8);if(stars===7)document.querySelector('#continue').classList.remove('hidden')};
const questions=[['Who deserves cake today?',['The neighbour','The cat','Minsa 👑'],2],['What is the best birthday superpower?',['Finding extra cake','Doing chores','Being a lamp'],0],['How much birthday sparkle is enough?',['One tiny speck','A sensible amount','All of it ✨'],2]];function quizRender(){let q=questions[quiz];document.querySelector('#question').textContent=q[0];document.querySelector('#answers').innerHTML=q[1].map((a,i)=>`<button class="btn alt" onclick="answer(${i})">${a}</button>`).join('')};window.answer=(n)=>{let q=questions[quiz];if(n===q[2]){quiz++;burst(12);if(quiz===3){document.querySelector('#question').textContent='Excellent. Your birthday intelligence is dangerously high 😂🧠';document.querySelector('#answers').innerHTML='';document.querySelector('#continue').classList.remove('hidden')}else quizRender()}else document.querySelector('#reaction').textContent='A bold guess… but Minsa’s birthday brain says try again 😌'};
window.lie=()=>{document.querySelector('#reaction').textContent='';document.querySelector('button[onclick="lie()"]').disabled=true;setTimeout(()=>{if(step===9){document.querySelector('#reaction').innerHTML='Actually… I lied. 😭😂<br>There is ONE FINAL SURPRISE.';burst(20);setTimeout(()=>{if(step===9)document.querySelector('#continue').classList.remove('hidden')},1100)}},1200)};
function final(){main.innerHTML=card(`<div class="progress"><span>Task 10/10 · Mission complete!</span><span class="track"><span class="fill" style="display:block;width:100%"></span></span></div><span class="eyebrow">Wait for it… 👀</span><h2>Minsa… this one is really for you. 💕</h2><p id="wait">A tiny surprise is getting ready…</p><div class="giftstage" id="stage"><span class="bear" aria-label="Teddy bear">🧸</span><span class="gift" aria-label="Gift box">🎁</span><span class="duck" aria-label="A happy duck appears">🦆</span></div><div id="birthday" class="hidden"><h1>HAPPY BIRTHDAY, MINSA! 🎉💕</h1><h2>4 October 🎂</h2><p>I wish may you live long with happiness.</p><p>Mission completed! 🎉<br>You survived all 10 tasks. 😂💕</p><p>Now go enjoy your cake! 🎂🦆</p><button class="btn alt" onclick="replay()">Play the mission again ↻</button></div>`);setTimeout(()=>{if(step!==10)return;document.querySelector('#stage').classList.add('reveal');document.querySelector('#wait').textContent='SURPRISE!';burst(90);setTimeout(()=>{if(step===10){document.querySelector('#birthday').classList.remove('hidden');startMusic()}},700)},3000)}window.replay=()=>{step=0;quiz=0;stars=0;candles=3;home()};
// Traditional melody, generated locally so no external audio file or service is required.
function startMusic(){if(musicOn)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();musicOn=true;document.querySelector('#music').textContent='♫ Music: on';document.querySelector('#music').setAttribute('aria-pressed','true');playSong()}catch(e){musicOn=false}}
function playSong(){if(!musicOn||!ctx)return;const notes=[{n:392,d:.32},{n:392,d:.22},{n:440,d:.55},{n:392,d:.55},{n:523,d:.55},{n:494,d:.95},{n:392,d:.32},{n:392,d:.22},{n:440,d:.55},{n:392,d:.55},{n:587,d:.55},{n:523,d:.95},{n:392,d:.32},{n:392,d:.22},{n:784,d:.55},{n:659,d:.55},{n:523,d:.55},{n:494,d:.55},{n:440,d:.9},{n:698,d:.32},{n:698,d:.22},{n:659,d:.55},{n:523,d:.55},{n:587,d:.55},{n:523,d:1.1}];let at=ctx.currentTime+.12;notes.forEach(({n,d})=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=n;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.045,at+.025);g.gain.exponentialRampToValueAtTime(.0001,at+d*.92);o.connect(g);g.connect(ctx.destination);o.start(at);o.stop(at+d);at+=d+.035});timer=setTimeout(()=>playSong(),(at-ctx.currentTime+1)*1000)}document.querySelector('#music').onclick=()=>{if(musicOn){musicOn=false;clearTimeout(timer);if(ctx)ctx.suspend();document.querySelector('#music').textContent='♫ Music: off';document.querySelector('#music').setAttribute('aria-pressed','false')}else{if(ctx&&ctx.state==='suspended')ctx.resume();startMusic()}};home();
})();
</script></body></html>
